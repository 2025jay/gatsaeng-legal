<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>갓생습관 - 법적 고지</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
      background: #14B8A6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }
    .eyebrow {
      color: #14B8A6;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 36px;
      font-weight: 900;
      color: #0F172A;
      margin-bottom: 12px;
    }
    .subtitle {
      color: #475569;
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 40px;
      line-height: 1.6;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .link {
      display: block;
      background: #F0FDFA;
      color: #115E59;
      padding: 20px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      transition: all 0.2s;
      border: 2px solid #14B8A6;
    }
    .link:hover {
      background: #14B8A6;
      color: white;
      transform: translateY(-2px);
    }
    .footer {
      margin-top: 32px;
      font-size: 13px;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">GOD-LIFE HABIT</div>
    <h1>갓생습관</h1>
    <p class="subtitle">매일 한 걸음,<br>나만의 갓생 시작해요</p>
    <div class="links">
      <a href="./privacy.html" class="link">개인정보처리방침</a>
      <a href="./terms.html" class="link">이용약관</a>
    </div>
    <p class="footer">© 2026 갓생습관</p>
  </div>
</body>
</html>
